
models:
  - name: nations
    description: Table for nation's data
    columns:
      - name: nation_id
        description: Primary key for this table
        data_tests:
          - unique
          - not_null
      - name: region_id
        description: Foreign key for this table
  - name: regions
    columns:
      - name: name
        data_tests:
          - accepted_values:
              arguments:
                values: ['AFRICA', 'ASIA', 'EUROPE', 'AMERICA']
              config:
                store_failures: true

  - name: orders
    columns:
      - name: total_price
        data_tests:
          - order_value:
              arguments:
                val: 880
              config:
                store_failures: true
