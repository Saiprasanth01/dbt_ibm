models:
  - name: nations
    columns:
      - name: nation_id
        data_tests:
          - unique
          - not_null

  - name: regions
    columns:
      - name: name
        data_tests:
          - accepted_values:
              arguments:
                values: ['AFRICA', 'ASIA', 'EUROPE', 'AMERICA']
              config:
                store_failures: true

  - name: orders
    columns:
      - name: total_price
        data_tests:
          - ordertest:
              arguments:
                values: 880
              config:
                store_failures: true
